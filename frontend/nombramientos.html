
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Nombramientos</h1>
    <button onclick="Npost()">Post</button>
    <button onclick="put()">Put</button>
    <button onclick="eliminar()">Delete</button>

    <script>
        //estructura de solicitud
        let url = "http://localhost:8081/nombramientos"

        function Npost(){
            fetch(url, {
                method : "POST"
            })
            .then(respuesta => {
                return respuesta.json()
            })
            .then(datos => {
                console.log(datos)
            })
            .catch(error => {
                console.log(error)
            })
        }

        function put(){
            fetch(url + "/1", {
                method : "PUT"
            })
            .then(respuesta => {
                return respuesta.json()
            })
            .then(datos => {
                console.log(datos)
            })
            .catch(error => {
                console.log(error)
            })
        }

        function eliminar(){
            fetch(url + "/1", {
                method : "DELETE"
            })
            .then(respuesta => {
                return respuesta.json()
            })
            .then(datos => {
                console.log(datos)
            })
            .catch(error => {
                console.log(error)
            })
        }
    </script>
</body>
</html>
