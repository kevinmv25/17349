<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Obtener saludador</h1>
    <label for="">Usuario:</label>
    <input type="text" id="usuarios" disabled>
    <button onclick="obtener()"></button>
    <script>
        function obtener(){
            url = "htto://localhost:8081/obtenerSaludador"
            fetch(url)
            .then(respuesta =>{
                return respuesta.json //esto porque obtenerSaludador devuelve un json, si no marcaria error
            })
            .then(datos =>{
                console.log(datos)
            })
            .catch(error =>{
                console.log(error)
            })
        }
    </script>
</body>
</html>
