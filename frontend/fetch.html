        function llamar3(){
            let URL = "https://jsonplaceholder.typicode.com/users/1"
            let parametros = ""
            fetch(URL)
            .then( async respuesta => {
                console.log(respuesta.status)
                datos = await respuesta.json() //deserializa la petición

                return datos
